# Test profile: self-contained in-memory H2 so the Spring context can boot without a
# real PostgreSQL instance or DB_* env vars. Concrete values here shadow the ${...}
# placeholders in the base application.properties (profile properties take precedence).

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Concrete mail values so the base file's ${MAIL_*} placeholders don't need resolving.
spring.mail.username=test@example.com
spring.mail.password=test
